version: 2
log-file: /tmp/efm-langserver.log
log-level: 5
root-markers:
  - .git/
tools:
  prettier: &prettier
    format-command: 'prettier --stdin-filepath ${INPUT}'
    format-stdin: true
languages:
  typescript:
    - <<: *prettier
  typescriptreact:
    - <<: *prettier
  go:
    -
      format-command: goimports
      format-stdin: true
