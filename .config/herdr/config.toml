# Migrated from ~/.config/tmux/tmux.conf.

onboarding = false

[theme]
# Follow the outer terminal's colors, like tmux's bg=default,fg=default.
name = "terminal"

[terminal]
default_shell = "/bin/zsh"
shell_mode = "auto"
new_cwd = "follow"

[keys]
prefix = "ctrl+q"

# Panes
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"
split_horizontal = "prefix+s"
split_vertical = "prefix+v"
close_pane = "prefix+x"
swap_pane_up = "prefix+shift+["
swap_pane_down = "prefix+shift+]"
resize_mode = "prefix+shift+r"

# Tabs (tmux windows)
new_tab = "prefix+c"
previous_tab = "prefix+p"
next_tab = "prefix+n"

# Copy mode and configuration
copy_mode = "prefix+esc"
reload_config = "prefix+r"

[ui]
mouse_capture = true
sidebar_start_collapsed = true
tab_bar_position = "bottom"

[ui.toast]
delivery = "off"

[ui.sound]
enabled = false

[experimental]
# tmux did not persist pane contents.
pane_history = false
